spring.application.name=backend

server.port=8080


# =========================================================
# POSTGRESQL
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_microempresas}
spring.datasource.username=${DB_USER:gestion_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration



# =========================================================
# FRONTEND
# =========================================================

app.frontend-url=${FRONTEND_URL:http://localhost:3000}


# =========================================================
# JWT
# =========================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=gestion-microempresas
app.jwt.expiration-minutes=480


# =========================================================
# COOKIE DE AUTENTICACION
# =========================================================

app.auth.cookie-name=access_token
app.auth.cookie-secure=${COOKIE_SECURE:false}




# =========================================================
# BACKEND PUBLIC URL
# =========================================================

app.backend-url=${BACKEND_URL:http://localhost:8080}


# =========================================================
# FILE STORAGE
# =========================================================

app.storage.base-directory=${STORAGE_DIRECTORY:storage}

# =========================================================
# INITIAL ADMINISTRATOR
# =========================================================

app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}

app.bootstrap-admin.name=${APP_ADMIN_NAME:Administrador}

app.bootstrap-admin.email=${APP_ADMIN_EMAIL:}

app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}


# =========================================================
# AUTH RATE LIMIT
# DEVELOPMENT DEFAULTS
# =========================================================

app.security.rate-limit.login.ip.max-attempts=${LOGIN_RATE_LIMIT_IP_MAX:120}

app.security.rate-limit.login.identity.max-attempts=${LOGIN_RATE_LIMIT_IDENTITY_MAX:30}

app.security.rate-limit.login.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

app.security.rate-limit.registration.ip.max-attempts=${REGISTRATION_RATE_LIMIT_IP_MAX:50}

app.security.rate-limit.registration.window-minutes=${REGISTRATION_RATE_LIMIT_WINDOW_MINUTES:60}

# =========================================================
# MULTIPART UPLOAD LIMITS
# =========================================================

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:2MB}

spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:12MB}

# =========================================================
# PROBLEM REPORT EMAIL
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.problem-report.destination-email=${PROBLEM_REPORT_EMAIL:}