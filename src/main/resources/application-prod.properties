# =========================================================
# PRODUCTION PROFILE
# =========================================================


# =========================================================
# REVERSE PROXY
# =========================================================

server.forward-headers-strategy=framework


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USER}

spring.datasource.password=${DB_PASSWORD}


# =========================================================
# FRONTEND / BACKEND
# =========================================================

app.frontend-url=${FRONTEND_URL}

app.backend-url=${BACKEND_URL}


# =========================================================
# JWT
# =========================================================

app.jwt.secret=${JWT_SECRET}


# =========================================================
# AUTH COOKIE
# =========================================================

app.auth.cookie-secure=true


# =========================================================
# STORAGE
# =========================================================

app.storage.base-directory=${STORAGE_DIRECTORY}


# =========================================================
# BOOTSTRAP
# =========================================================

app.bootstrap-admin.enabled=false


# =========================================================
# RATE LIMIT - PRODUCTION
# =========================================================

app.security.rate-limit.login.ip.max-attempts=${LOGIN_RATE_LIMIT_IP_MAX:30}

app.security.rate-limit.login.identity.max-attempts=${LOGIN_RATE_LIMIT_IDENTITY_MAX:8}

app.security.rate-limit.login.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

app.security.rate-limit.registration.ip.max-attempts=${REGISTRATION_RATE_LIMIT_IP_MAX:5}

app.security.rate-limit.registration.window-minutes=${REGISTRATION_RATE_LIMIT_WINDOW_MINUTES:60}


# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.jpa.show-sql=false